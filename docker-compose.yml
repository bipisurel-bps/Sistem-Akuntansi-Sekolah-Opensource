# Percobaan lokal: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sas_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-sas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sas} -d ${POSTGRES_DB:-sas}"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    image: ${APP_IMAGE:-sas-opensource:local}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-sas}:${POSTGRES_PASSWORD:-sas_local_password}@db:5432/${POSTGRES_DB:-sas}
      SESSION_SECRET: ${SESSION_SECRET:-sas-local-demo-only-change-before-production-2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      APP_NAME: ${APP_NAME:-Sistem Akuntansi Sekolah (SAS) Open Source}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-Yayasan Pendidikan Contoh}
      SCHOOL_NAME: ${SCHOOL_NAME:-Sekolah SAS}
      SEED_PASSWORD: ${SEED_PASSWORD:-sasDemo123!}
      SEED_EMAIL_DOMAIN: ${SEED_EMAIL_DOMAIN:-sekolah.example}
      SEED_MODE: ${SEED_MODE:-demo}
    command: ["sh", "-c", "node src/db/initialize.js && exec node server.js"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - appdata:/app/data
volumes:
  pgdata:
  appdata:
